<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Your projects</title>
<!--
  KAppMaker AI — project board UI. Served by ~/bin/board-server.mjs from the
  customer's own box; never loads anything from the network (the server sends a
  CSP with default-src 'none'), so this file is deliberately self-contained.

  READ-ONLY BY DESIGN: there is no request here that changes anything except
  sign-out. Every card offers a jump into the bot's Telegram chat instead —
  the bot is the only thing that writes.

  Untrusted-by-default rendering: project names, checklist text and feed lines
  come from files on the box. They are ALWAYS inserted with textContent, never
  innerHTML, so a stray "<script>" in a markdown checklist stays inert text.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink-900:#0b0f0e; --ink-800:#0f1513; --ink-700:#151d1a;
    --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
    --text:#e5e5e5; --muted:#a3a3a3; --dim:#737373;
    --primary:#10b981; --primary-400:#34d399; --primary-300:#6ee7b7;
    --amber:#fbbf24;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--ink-900); color:var(--text);
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:72rem; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--primary-400); text-decoration:none; }
  a:hover { color:var(--primary-300); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

  header.top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  h1 { font-size:1.5rem; margin:0; font-weight:700; letter-spacing:-.01em; }
  .grow { flex:1 1 auto; }
  .chip {
    display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:99px;
    border:1px solid var(--line); background:rgba(16,185,129,.08); color:var(--primary-300);
    font-size:.8rem; font-weight:600;
  }
  .dot { width:8px; height:8px; border-radius:99px; background:var(--primary); position:relative; flex:none; }
  .dot.live::after {
    content:""; position:absolute; inset:0; border-radius:99px; background:var(--primary);
    animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;
  }
  .dot.idle { background:var(--dim); }
  @keyframes ping { 75%,100% { transform:scale(2.4); opacity:0; } }
  .ghost { color:var(--muted); font-size:.85rem; padding:6px 10px; border-radius:99px; border:1px solid var(--line); }
  .ghost:hover { color:var(--text); border-color:rgba(255,255,255,.2); }

  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(19rem,1fr)); }
  .card {
    border:1px solid var(--line); background:rgba(15,21,19,.6); border-radius:20px; padding:20px;
    display:flex; flex-direction:column; gap:14px; text-align:left; width:100%;
    transition:border-color .15s ease, transform .15s ease;
  }
  button.card:hover { border-color:rgba(16,185,129,.4); transform:translateY(-2px); }
  .card h2 { margin:0; font-size:1.05rem; font-weight:650; overflow-wrap:anywhere; }
  .row { display:flex; align-items:center; gap:12px; }
  .muted { color:var(--muted); font-size:.85rem; }
  .dim { color:var(--dim); font-size:.8rem; }
  .badge {
    font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:99px;
    border:1px solid var(--line); color:var(--muted);
  }
  .badge.warn { border-color:rgba(251,191,36,.25); background:rgba(251,191,36,.1); color:var(--amber); }

  .ring { flex:none; }
  .ring circle { fill:none; stroke-width:6; }
  .ring .track { stroke:rgba(255,255,255,.08); }
  .ring .val { stroke:var(--primary); stroke-linecap:round; transition:stroke-dasharray .4s ease; }
  .ring text { fill:var(--text); font-size:15px; font-weight:700; text-anchor:middle; }

  .doing {
    border:1px solid rgba(16,185,129,.25); background:rgba(16,185,129,.07);
    border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
  }
  #view > .doing, #view > .summary { margin-bottom:16px; }
  .summary { display:flex; align-items:center; gap:14px; }
  .doing .what { font-size:.9rem; }

  .cols { display:grid; gap:16px; grid-template-columns:repeat(3,1fr); align-items:start; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }
  .col { border:1px solid var(--line); background:rgba(15,21,19,.45); border-radius:18px; padding:14px; }
  .col > h3 {
    margin:0 0 12px; font-size:.78rem; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); display:flex; justify-content:space-between; align-items:center;
  }
  .item {
    border:1px solid var(--line-soft); background:var(--ink-800); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; font-size:.9rem; overflow-wrap:anywhere; cursor:default;
  }
  .item.clamped .txt {
    display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .item .sec { color:var(--dim); font-size:.72rem; margin-top:6px; }
  .item.is-done { opacity:.62; }
  .item.is-done .txt { text-decoration:line-through; text-decoration-color:rgba(255,255,255,.3); }
  .item.is-doing { border-color:rgba(16,185,129,.45); background:rgba(16,185,129,.08); }

  .feed { margin-top:28px; border:1px solid var(--line); border-radius:18px; background:rgba(15,21,19,.45); }
  .feed > summary {
    list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:10px;
    font-weight:600; font-size:.95rem;
  }
  .feed > summary::-webkit-details-marker { display:none; }
  .feed ol { margin:0; padding:0 18px 18px; list-style:none; max-height:22rem; overflow-y:auto; }
  .feed li { display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line-soft); font-size:.87rem; }
  .feed li:first-child { border-top:0; }
  .feed .when { color:var(--dim); font-variant-numeric:tabular-nums; flex:none; font-size:.78rem; padding-top:2px; }
  .feed .who { color:var(--primary-300); flex:none; font-size:.78rem; padding-top:2px; }
  .feed .what { overflow-wrap:anywhere; }
  .feed .k-says .what { color:var(--text); }
  .feed .k-tool .what { color:var(--muted); }
  .feed .k-you .what { color:var(--primary-300); }
  .feed .times { color:var(--dim); }

  .cta {
    display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    border-radius:99px; background:var(--primary); color:#06120e; font-weight:650; font-size:.85rem;
    padding:8px 16px;
  }
  .cta:hover { background:var(--primary-400); color:#06120e; }
  .cta.quiet { background:rgba(16,185,129,.12); color:var(--primary-300); border:1px solid rgba(16,185,129,.3); }

  .empty { border:1px dashed var(--line); border-radius:18px; padding:28px; text-align:center; color:var(--muted); }
  .back { font-size:.85rem; display:inline-block; margin-bottom:12px; }
  .err { border:1px solid rgba(248,113,113,.3); background:rgba(248,113,113,.08); color:#fca5a5;
         border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:.9rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Your projects</h1>
    <span class="grow"></span>
    <span class="chip" id="bots" hidden></span>
    <button class="ghost" id="signout" type="button">Sign out</button>
  </header>

  <div class="err" id="error" hidden></div>
  <div id="view"></div>

  <details class="feed" id="feed" open>
    <summary><span class="dot idle" id="feedDot"></span>Live — what your builders are doing</summary>
    <ol id="feedList"><li><span class="what muted">Waiting for activity…</span></li></ol>
  </details>

  <p class="dim" style="margin-top:22px">
    This board only reads. To change anything — add a feature, start an app, fix a bug —
    message your builder in Telegram.
  </p>
</div>

<script>
(function () {
  'use strict'

  var view = document.getElementById('view')
  var titleEl = document.getElementById('title')
  var botsEl = document.getElementById('bots')
  var errEl = document.getElementById('error')
  var feedList = document.getElementById('feedList')
  var feedDot = document.getElementById('feedDot')

  var state = null
  var pollTimer = null
  var source = null
  var feed = []          // newest first, capped
  var FEED_MAX = 200
  var feedFilter = null  // null = every bot; otherwise the workers on one app
  var seenEvents = new Set()

  // ---------------------------------------------------------------- helpers

  function el (tag, className, text) {
    var node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined && text !== null) node.textContent = String(text)
    return node
  }

  function clear (node) { while (node.firstChild) node.removeChild(node.firstChild) }

  function ago (iso) {
    if (!iso) return ''
    var then = Date.parse(iso)
    if (isNaN(then)) return ''
    var secs = Math.max(0, (Date.now() - then) / 1000)
    if (secs < 60) return 'just now'
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago'
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago'
    return Math.floor(secs / 86400) + 'd ago'
  }

  function clockOf (iso) {
    var when = new Date(iso)
    if (isNaN(when.getTime())) return ''
    return String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0')
  }

  function botLabel (worker) {
    var n = /app([0-9]+)/.exec(worker || '')
    return n ? 'Bot ' + n[1] : (worker || 'Your bot')
  }

  function showError (message) {
    if (!message) { errEl.hidden = true; return }
    errEl.textContent = message
    errEl.hidden = false
  }

  function get (url) {
    return fetch(url, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) { location.reload(); throw new Error('signed out') }
        if (!res.ok) throw new Error('Could not reach your box (' + res.status + ')')
        return res.json()
      })
  }

  // ------------------------------------------------------------ progress ring

  function ring (done, total) {
    var pct = total > 0 ? Math.round((done / total) * 100) : 0
    var r = 26, c = 2 * Math.PI * r
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('class', 'ring')
    svg.setAttribute('width', '64'); svg.setAttribute('height', '64')
    svg.setAttribute('viewBox', '0 0 64 64')
    svg.setAttribute('aria-hidden', 'true')

    function circle (cls, dash) {
      var node = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
      node.setAttribute('class', cls)
      node.setAttribute('cx', '32'); node.setAttribute('cy', '32'); node.setAttribute('r', String(r))
      if (dash) {
        node.setAttribute('stroke-dasharray', dash)
        node.setAttribute('transform', 'rotate(-90 32 32)')
      }
      return node
    }
    svg.appendChild(circle('track'))
    // A zero-length dash still paints a dot with stroke-linecap:round, so at 0%
    // draw no arc at all rather than a misleading speck of progress.
    if (pct > 0) svg.appendChild(circle('val', (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1)))

    var label = document.createElementNS('http://www.w3.org/2000/svg', 'text')
    label.setAttribute('x', '32'); label.setAttribute('y', '37')
    label.textContent = total > 0 ? pct + '%' : '–'
    svg.appendChild(label)
    return svg
  }

  // ------------------------------------------------------------ projects view

  function renderProjects () {
    titleEl.textContent = 'Your projects'
    clear(view)

    var workers = state.workers || []
    var live = workers.filter(function (w) { return w.task && w.task.subject })
    botsEl.hidden = workers.length === 0
    if (!botsEl.hidden) {
      clear(botsEl)
      botsEl.appendChild(el('span', 'dot ' + (live.length ? 'live' : 'idle')))
      botsEl.appendChild(el('span', null,
        workers.length + (workers.length === 1 ? ' builder' : ' builders') +
        (live.length ? ' — ' + live.length + ' working' : ' — idle')))
    }

    // With several helpers the first question is "who is on what right now" —
    // answer it before the project grid, not inside it.
    if (workers.length > 1) {
      var strip = el('div', 'card')
      strip.style.marginBottom = '16px'
      strip.appendChild(el('h2', null, 'Your builders'))
      workers.forEach(function (worker) {
        var row = el('div', 'row')
        row.appendChild(el('span', 'dot ' + (worker.task && worker.task.subject ? 'live' : 'idle')))
        var line = el('div', 'what')
        line.appendChild(el('strong', null, botLabel(worker.worker)))
        if (worker.project) {
          line.appendChild(document.createTextNode(' on '))
          var jump = el('a', null, worker.project)
          jump.href = '#/p/' + encodeURIComponent(worker.project)
          line.appendChild(jump)
          if (worker.via === 'activity') line.appendChild(el('span', 'dim', '  (from its recent work)'))
        } else {
          line.appendChild(document.createTextNode(' — not on a project yet'))
        }
        if (worker.task && worker.task.subject) {
          line.appendChild(el('div', 'muted', worker.task.activeForm || worker.task.subject))
        } else {
          line.appendChild(el('div', 'dim', 'Idle — waiting for you'))
        }
        row.appendChild(line)
        strip.appendChild(row)
      })
      view.appendChild(strip)
    }

    if (!state.projects || state.projects.length === 0) {
      var blank = el('div', 'empty')
      blank.appendChild(el('p', null, 'No projects yet.'))
      blank.appendChild(el('p', 'dim', 'Message your builder in Telegram with an app idea and it will start one here.'))
      view.appendChild(blank)
      return
    }

    var grid = el('div', 'grid')
    state.projects.forEach(function (project) {
      grid.appendChild(projectCard(project))
    })
    view.appendChild(grid)
  }

  function projectCard (project) {
    var card = el('button', 'card')
    card.type = 'button'
    card.addEventListener('click', function () { location.hash = '#/p/' + encodeURIComponent(project.slug) })

    var head = el('div', 'row')
    head.appendChild(ring(project.done, project.total))
    var names = el('div')
    names.appendChild(el('h2', null, project.name))
    names.appendChild(el('div', 'muted', project.total > 0
      ? project.done + ' of ' + project.total + ' done'
      : 'No checklist yet'))
    head.appendChild(names)
    card.appendChild(head)

    ;(project.bots || []).forEach(function (bot) {
      var doing = el('div', 'doing')
      doing.appendChild(el('span', 'dot ' + (bot.task && bot.task.subject ? 'live' : 'idle')))
      var what = el('div', 'what')
      what.appendChild(el('strong', null, botLabel(bot.worker)))
      if (bot.task && bot.task.subject) {
        what.appendChild(document.createTextNode(' is on '))
        what.appendChild(el('span', null, bot.task.activeForm || bot.task.subject))
      } else {
        what.appendChild(document.createTextNode(' is here, waiting for you'))
      }
      doing.appendChild(what)
      card.appendChild(doing)
    })

    var meta = el('div', 'row')
    if (project.git && project.git.lastCommit) {
      meta.appendChild(el('span', 'dim', 'Last change ' + ago(project.git.lastCommit.at)))
    } else if (project.git && project.git.isRepo) {
      meta.appendChild(el('span', 'dim', 'No commits yet'))
    } else {
      meta.appendChild(el('span', 'dim', 'Not a git repo'))
    }
    if (project.git && project.git.dirty > 0) {
      meta.appendChild(el('span', 'badge warn', project.git.dirty + ' unsaved'))
    }
    if (!project.hasChecklist) {
      meta.appendChild(el('span', 'badge', 'no checklist'))
    }
    card.appendChild(meta)
    return card
  }

  // -------------------------------------------------------------- board view

  function renderProject (project) {
    titleEl.textContent = project.name
    botsEl.hidden = true
    clear(view)

    var back = el('a', 'back', '← All projects')
    back.href = '#/'
    view.appendChild(back)

    var items = project.items || []
    if (project.hasChecklist) {
      var doneCount = items.filter(function (item) { return item.done }).length
      var summary = el('div', 'summary')
      summary.appendChild(ring(doneCount, items.length))
      var counts = el('div')
      counts.appendChild(el('div', null, doneCount + ' of ' + items.length + ' done'))
      counts.appendChild(el('div', 'muted', (items.length - doneCount) + ' still to build'))
      summary.appendChild(counts)
      view.appendChild(summary)
    }

    var bots = project.bots || []
    // Scope the live feed to the bots on THIS app, so a busy second helper
    // elsewhere doesn't bury what you came here to watch.
    feedFilter = bots.length ? bots.map(function (bot) { return bot.worker }) : null
    renderFeed()

    bots.forEach(function (bot) {
      var strip = el('div', 'doing')
      strip.appendChild(el('span', 'dot ' + (bot.task && bot.task.subject ? 'live' : 'idle')))
      var what = el('div', 'what')
      what.appendChild(el('strong', null, botLabel(bot.worker)))
      if (bot.task && bot.task.subject) {
        what.appendChild(document.createTextNode(' is working on '))
        what.appendChild(el('span', null, bot.task.activeForm || bot.task.subject))
      } else {
        what.appendChild(document.createTextNode(' is on this app, waiting for you'))
      }
      strip.appendChild(what)
      view.appendChild(strip)
    })

    if (!project.hasChecklist) {
      var blank = el('div', 'empty')
      blank.appendChild(el('p', null, 'This project has no feature checklist yet.'))
      blank.appendChild(el('p', 'dim', 'Ask your builder to “set up a progress checklist for ' + project.name + '” and it will read the code and write one.'))
      bots.filter(function (bot) { return bot.handle }).forEach(function (bot) {
        blank.appendChild(chatButton(bot.handle, 'Ask ' + botLabel(bot.worker)))
      })
      view.appendChild(blank)
      return
    }

    var columns = { backlog: [], doing: [], done: [] }
    ;(project.items || []).forEach(function (item) { columns[item.column].push(item) })

    var wrap = el('div', 'cols')
    wrap.appendChild(column('To do', columns.backlog, 'backlog'))
    wrap.appendChild(column('Doing', columns.doing, 'doing'))
    wrap.appendChild(column('Done', columns.done, 'done'))
    view.appendChild(wrap)

    var chats = bots.filter(function (bot) { return bot.handle })
    if (chats.length > 0) {
      var foot = el('div', 'row')
      foot.style.marginTop = '20px'
      chats.forEach(function (bot) {
        foot.appendChild(chatButton(bot.handle, chats.length > 1
          ? 'Message ' + botLabel(bot.worker)
          : 'Message ' + botLabel(bot.worker) + ' about this app'))
      })
      view.appendChild(foot)
    }
    if (project.progressFiles && project.progressFiles.length > 1) {
      view.appendChild(el('p', 'dim', 'Showing ' + project.file + ' — this project also has: ' +
        project.progressFiles.filter(function (f) { return f !== project.file }).join(', ')))
    }
  }

  function column (label, items, kind) {
    var col = el('div', 'col')
    var head = el('h3', null, label)
    head.appendChild(el('span', 'badge', String(items.length)))
    col.appendChild(head)

    if (items.length === 0) {
      col.appendChild(el('p', 'dim', kind === 'doing' ? 'Nothing in flight' : 'Nothing here'))
      return col
    }
    items.forEach(function (item) {
      var node = el('div', 'item clamped' + (item.done ? ' is-done' : '') + (kind === 'doing' ? ' is-doing' : ''))
      node.appendChild(el('div', 'txt', item.text))
      if (item.section) node.appendChild(el('div', 'sec', item.section))
      node.addEventListener('click', function () { node.classList.toggle('clamped') })
      col.appendChild(node)
    })
    return col
  }

  function chatButton (handle, label) {
    var link = el('a', 'cta', label + ' ↗')
    link.href = 'https://t.me/' + encodeURIComponent(handle)
    link.target = '_blank'
    link.rel = 'noopener noreferrer'
    return link
  }

  // ------------------------------------------------------------- live feed

  function pushFeedEvent (event) {
    // Every SSE reconnect re-reads the tail of the transcript, so the same
    // lines arrive again. Drop anything already shown before it reaches the UI.
    var key = event.worker + '|' + event.at + '|' + event.text
    if (seenEvents.has(key)) return
    seenEvents.add(key)
    if (seenEvents.size > FEED_MAX * 4) {
      var oldest = seenEvents.values().next().value
      seenEvents.delete(oldest)
    }

    var last = feed[0]
    // Coalesce repeats so a gradle loop doesn't drown a phone screen.
    if (last && last.worker === event.worker && last.text === event.text) {
      last.times = (last.times || 1) + 1
      last.at = event.at
    } else {
      feed.unshift({ at: event.at, worker: event.worker, kind: event.kind, text: event.text, times: 1 })
      if (feed.length > FEED_MAX) feed.length = FEED_MAX
    }
    renderFeed()
  }

  var feedRaf = null
  function renderFeed () {
    if (feedRaf) return
    feedRaf = requestAnimationFrame(function () {
      feedRaf = null
      clear(feedList)
      var shown = feedFilter
        ? feed.filter(function (entry) { return feedFilter.indexOf(entry.worker) !== -1 })
        : feed
      if (shown.length === 0) {
        var idle = el('li')
        idle.appendChild(el('span', 'what muted', feedFilter
          ? 'Nothing happening on this app right now.'
          : 'Nothing happening right now — your builders are idle.'))
        feedList.appendChild(idle)
        return
      }
      shown.slice(0, 80).forEach(function (entry) {
        var row = el('li', 'k-' + entry.kind)
        row.appendChild(el('span', 'when', clockOf(entry.at)))
        row.appendChild(el('span', 'who', botLabel(entry.worker)))
        var what = el('span', 'what', entry.kind === 'you' ? 'You: ' + entry.text : entry.text)
        if (entry.times > 1) what.appendChild(el('span', 'times', '  ×' + entry.times))
        row.appendChild(what)
        feedList.appendChild(row)
      })
    })
  }

  function connectStream () {
    if (source) { source.close(); source = null }
    source = new EventSource('/api/stream')
    source.onopen = function () { feedDot.className = 'dot live' }
    source.onmessage = function (message) {
      try { pushFeedEvent(JSON.parse(message.data)) } catch (e) { /* ignore malformed frame */ }
    }
    source.onerror = function () {
      feedDot.className = 'dot idle'
      // EventSource retries on its own; only reconnect by hand if it gave up.
      if (source && source.readyState === 2) {
        source = null
        setTimeout(function () { if (!document.hidden) connectStream() }, 5000)
      }
    }
  }

  // ------------------------------------------------------------------ routing

  function currentSlug () {
    var match = /^#\/p\/(.+)$/.exec(location.hash)
    return match ? decodeURIComponent(match[1]) : null
  }

  function refresh () {
    var slug = currentSlug()
    var request = slug ? get('/api/projects/' + encodeURIComponent(slug)) : get('/api/state')
    return request.then(function (data) {
      showError(null)
      if (slug) {
        renderProject(data)
      } else {
        feedFilter = null           // back to all projects → show every bot again
        state = data
        renderProjects()
        renderFeed()
      }
    }).catch(function (error) {
      if (error && error.message !== 'signed out') showError(error.message)
    })
  }

  function schedule () {
    clearInterval(pollTimer)
    pollTimer = setInterval(function () { if (!document.hidden) refresh() }, 10000)
  }

  document.getElementById('signout').addEventListener('click', function () {
    fetch('/logout', { method: 'POST', headers: { 'X-Board-Request': '1' }, credentials: 'same-origin' })
      .then(function () { location.href = '/' })
  })

  window.addEventListener('hashchange', refresh)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (source) { source.close(); source = null; feedDot.className = 'dot idle' }
    } else {
      refresh(); connectStream()
    }
  })

  refresh()
  schedule()
  connectStream()
})()
</script>
</body>
</html>
